name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Required for tauri-action to create/update the GitHub Release with GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: '--bundles deb,appimage'
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libappindicator3-dev conflicts with libayatana-appindicator3-dev on
          # Ubuntu 22.04; Tauri v2 only needs the latter.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: frontend

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Tag push: build the installers and publish them to a GitHub Release.
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LlamaGo v__VERSION__'
          releaseBody: |
            ## LlamaGo v__VERSION__

            llama.cpp 的桌面启动器：一键启停 `llama-server`、实时日志、系统托盘常驻。

            ### 下载

            | 平台 | 文件 |
            | ---- | ---- |
            | Windows | `LlamaGo___VERSION___x64-setup.exe`（推荐）/ `LlamaGo___VERSION___x64.msi` |
            | macOS | `LlamaGo___VERSION___*_*.dmg` |
            | Linux | `*.AppImage` / `*.deb` |

            > 使用前请自行准备 llama.cpp（`llama-server`）与 `.gguf` 模型，并在设置页配置路径。
            > macOS 安装包未签名，首次打开需在「系统设置 → 隐私与安全性」中允许。

            详细说明见 [README](https://github.com/Abossss/LlamaGo#readme)。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Manual run: build only, no Release. Installers are uploaded as artifacts.
      - name: Build installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: llamago-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/dmg/*.dmg
